<header style="padding: 1rem clamp(1.25rem, 5vw, 4rem); border-bottom: 1px solid #29312618;">

          <li class="nav-item"><a class="nav-link text-wrap text-break px-2 py-3 link-dark" href="#espacos" (click)="menuOpen.set(false)">Espaços</a></li>

          <li class="nav-item"><a class="nav-link text-wrap text-break px-2 py-3 link-dark" href="#contato" (click)="menuOpen.set(false)">Fale conosco</a></li>
          <li class="nav-item"><a class="nav-link text-wrap text-break px-2 py-3 link-dark fw-medium" href="#agenda" (click)="menuOpen.set(false)">Veja nossa agenda de reserva</a></li>

          <li class="nav-item"><a class="nav-link text-wrap text-break px-2 py-3 link-dark" href="?area=restrita" target="_blank" rel="noopener noreferrer" (click)="menuOpen.set(false)">Área restrita</a></li>

      </div>
    </div>
  </nav>
